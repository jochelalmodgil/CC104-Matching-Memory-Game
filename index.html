
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Christmas Memory Match</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

   <div id="snowflakes" class="snowflakes hidden">
    <span>❄</span>
    <span>❄</span>
    <span>❄</span>
    <span>❄</span>
    <span>❄</span>
    <span>❄</span>
    <span>❄</span>
    <span>❄</span>
</div>

    <!-- Main Game Container -->
    <main class="game-container">

        <!-- Game Header -->
        <header class="game-header">
            <h1>🎄 Christmas Memory Match 🎄</h1>
            <p>Find all the matching Christmas pairs!</p>
        </header>

        <!-- Game Information -->
        <section class="game-info">

            <div class="info-box">
                <h3>Attempts</h3>
                <p id="attempts">0</p>
            </div>

            <div class="info-box">
                <h3>Matches</h3>
                <p id="matches">0 / 6</p>
            </div>

        </section>

        <!-- Memory Card Grid -->
        <section id="game-board" class="game-board">

            <!-- Memory cards will be generated by JavaScript -->

        </section>

        <!-- Restart Button -->
        <div class="game-controls">
            <button id="restart-btn" class="btn btn-danger">
                🔄 Restart Game
            </button>
        </div>

    </main>

    <!-- Victory Screen -->
<div id="victory-screen" class="victory-screen hidden">

    <div class="victory-box">

        <h1>🎉 Congratulations! 🎉</h1>

        <p>You matched all 6 pairs!</p>

        <p id="final-attempts"></p>

        <button id="play-again-btn" class="btn btn-success">
            🎄 Play Again
        </button>

    </div>

</div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- JavaScript -->
    <script src="js/game.js"></script>

</body>
</html>
